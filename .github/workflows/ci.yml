name: CI

on:
  pull_request:
  push:
    branches: [main, demo]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build:ci
      - uses: actions/upload-artifact@v4
        with:
          name: ecce-static-export
          path: out

  lighthouse:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build
      - run: npm run lhci
